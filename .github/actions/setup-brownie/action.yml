name: "Setup Brownie"
description: "Install Python, Node, Poetry, npm deps, compile contracts, and import network config"

inputs:
  python-version:
    description: "Python version to install"
    required: true
  poetry-version:
    description: "Poetry version to install"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install poetry
      shell: bash
      run: pipx install poetry==${{ inputs.poetry-version }}

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: "poetry"

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: |
        poetry install
        npm ci

    - name: Install solc 0.8.6
      shell: bash
      run: |
        SOLC=~/.solcx/solc-v0.8.6
        mkdir -p ~/.solcx
        wget -qO "$SOLC" \
          https://github.com/ethereum/solidity/releases/download/v0.8.6/solc-static-linux
        echo "abd5c4f3f262bc3ed7951b968c63f98e83f66d9a5c3568ab306eac49250aec3e  $SOLC" | sha256sum -c -
        chmod +x "$SOLC"
        "$SOLC" --version

    - name: Compile contracts
      shell: bash
      run: poetry run brownie compile

    - name: Import network config
      shell: bash
      run: poetry run brownie networks import network-config.yaml True

    - name: System info
      shell: bash
      run: |
        echo "Memory and swap:"
        free -h
        echo
        echo "Disk:"
        df -h /
        echo
        echo "CPUs: $(nproc --all)"
