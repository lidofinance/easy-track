[profile.default]
src = "contracts"
test = "test/foundry/unit"
libs = ["node_modules"]
solc = "0.8.6"
evm_version = "berlin"
auto_detect_remappings = false
# The Foundry scripts under script/ target the modern-pragma interfaces, the scenario profile
# compiles them
skip = ["script/**"]

[profile.scenario]
src = "test/foundry/scenario"
test = "test/foundry/scenario"
out = "out/scenario"
cache_path = "cache/scenario"
solc = "0.8.38"
evm_version = "prague"
skip = []
# The scripts append their deployments to the records, nothing else is written
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployed-hoodi.json" },
    { access = "read-write", path = "./deployed-mainnet.json" },
]

# The deployed sources listed as "ignore" below were audited prior to the tooling migration, so they must stay exactly as audited.
# The formatter and the linter skip them to avoid styling modifications and reach only the files that are not listed. 
# The mocks under contracts/test are formatted but excluded from linting.

[fmt]
line_length = 100
tab_width = 4
style = "space"
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
hex_underscore = "remove"
single_line_statement_blocks = "preserve"
override_spacing = false
wrap_comments = false
docs_style = "preserve"
contract_new_lines = false
sort_imports = false
namespace_import_style = "prefer_plain"
pow_no_space = false
prefer_compact = "all"
single_line_imports = false
ignore = [
    "contracts/AllowedRecipientsRegistry.sol",
